  <script>
  document.addEventListener('DOMContentLoaded', function() {
    if (!window.i18n) return;
    
    function applyContentI18n() {
      var lang = window.i18n.getCurrentLang();
      
      function tr(el, key, patterns) {
        if (!el) return;
        var mk = el.getAttribute('data-i18n-key');
        if (mk) { el.textContent = window.i18n.t(mk); return; }
        if (!patterns) return;
        var text = el.textContent.trim();
        if (patterns.some(function(p) { return text.indexOf(p) !== -1; })) {
          el.textContent = window.i18n.t(key);
          el.setAttribute('data-i18n-key', key);
        }
      }
      
      var h1 = document.querySelector('#all h1');
      if (h1) { h1.textContent = window.i18n.t('contact.title'); h1.setAttribute('data-i18n-key', 'contact.title'); }
      
      document.querySelectorAll('#all p').forEach(function(p) {
        tr(p, 'contact.desc', ['\u5982\u679c\u4f60\u6709\u4efb\u4f55\u95ee\u9898','If you have any questions']);
        tr(p, 'contact.closing', ['\u671f\u5f85\u6536\u5230\u4f60\u7684\u6d88\u606f','Looking forward to hearing']);
      });
      
      document.querySelectorAll('#all h2').forEach(function(h) {
        tr(h, 'contact.resumeTitle', ['\u4e0b\u8f7d\u7b80\u5386','Download Resume']);
      });
      
      document.querySelectorAll('#all a').forEach(function(a) {
        tr(a, 'contact.resumeBtn', ['\u4e0b\u8f7d\u6211\u7684\u7b80\u5386','Download My Resume']);
      });
      
      var sb = document.getElementById('lang-toggle-sidebar');
      if (sb) sb.textContent = lang==='zh'?'EN':'\u4e2d';
    }
    
    applyContentI18n();
    
    var origToggle = window.i18n.toggleLang;
    window.i18n.toggleLang = function() { origToggle(); setTimeout(applyContentI18n, 50); };
    var origSetLang = window.i18n.setLang;
    window.i18n.setLang = function(lang) { origSetLang(lang); setTimeout(applyContentI18n, 50); };
  });
  </script>
